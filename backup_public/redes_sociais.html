﻿<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Sociais - Reverse Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/logo.png">
</head>
<body class="bg-slate-950 text-white font-sans antialiased">
            
    <header id="menu-admin" class="bg-slate-900 border-b border-slate-800 p-4 relative z-50 hidden">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="/logo.png" alt="Reverse Marketing" class="h-8 w-auto object-contain">
                <h1 class="text-xl font-bold">Reverse Marketing</h1>
            </div>
            <nav class="flex flex-wrap items-center gap-1 text-sm text-slate-300">
                <a href="/admin.html" class="px-3 py-2 rounded hover:bg-slate-800 hover:text-white transition-colors">Dashboard</a>
                <div class="relative group">
                    <button class="px-3 py-2 rounded hover:bg-slate-800 hover:text-white transition-colors flex items-center gap-1">Execução <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button>
                    <div class="absolute left-0 top-full mt-1 w-48 bg-slate-800 border border-slate-700 rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 flex flex-col overflow-hidden">
                        <a href="/redes_sociais.html" class="px-4 py-2 hover:bg-slate-700 text-white font-bold text-orange-400">Redes Sociais</a>
                    </div>
                </div>
                <button class="btn-sair bg-slate-800 hover:bg-red-600 text-white font-bold py-1.5 px-3 rounded transition-colors ml-2">Sair</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-3xl font-extrabold">Redes Sociais</h2>
                <p class="text-slate-400">Gerencie os posts e calendário editorial.</p>
            </div>
            <button onclick="abrirModalPost()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-lg">
                + Novo Post
            </button>
        </div>

        <div class="bg-slate-900 p-6 rounded-lg border border-slate-800">
            <h3 class="text-xl font-bold mb-4">Posts Agendados</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-slate-400">
                    <thead class="text-left text-slate-500 border-b border-slate-700 bg-slate-900/50">
                        <tr>
                            <th class="p-4">Data</th>
                            <th class="p-4">Cliente</th>
                            <th class="p-4">Plataforma</th>
                            <th class="p-4">Título</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Feedback</th>
                            <th class="p-4 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPosts">
                        <tr><td colspan="7" class="p-4 text-center">Carregando posts...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL DE NOVO POST -->
    <div id="modalPost" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-lg shadow-2xl w-full max-w-lg p-6 relative">
            <button onclick="fecharModalPost()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">&times;</button>
            <h3 class="text-2xl font-bold text-orange-400 mb-4 border-b border-slate-700 pb-2">Agendar Novo Post</h3>
            
            <form id="formPost" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Cliente *</label>
                    <select id="post_cliente" required class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white">
                        <option value="">Carregando clientes...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Título do Post *</label>
                    <input type="text" id="post_titulo" required placeholder="Ex: Promoção de Natal" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Plataforma</label>
                    <select id="post_plataforma" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white">
                        <option value="Instagram">Instagram</option>
                        <option value="Facebook">Facebook</option>
                        <option value="LinkedIn">LinkedIn</option>
                        <option value="TikTok">TikTok</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Data de Publicação</label>
                    <input type="date" id="post_data" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white">
                </div>
                <button type="submit" class="w-full py-3 bg-orange-500 hover:bg-orange-400 text-white font-bold rounded-lg mt-4">Agendar Post</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');

        async function carregarPosts() {
            try {
                // A rota que está no rotas_gerais.js é /api/acoes-sociais
                const response = await fetch('/api/acoes-sociais', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Falha ao buscar posts');
                
                const posts = await response.json();
                const tbody = document.getElementById('tabelaPosts');
                tbody.innerHTML = '';

                if (posts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center">Nenhum post agendado ainda.</td></tr>';
                    return;
                }

                posts.forEach(p => {
                    const data = p.data_publicacao ? new Date(p.data_publicacao + 'T00:00:00').toLocaleDateString('pt-BR') : 'Sem data';
                    const feedback = p.feedback ? `<span class="text-slate-300 italic">"${p.feedback}"</span>` : '<span class="text-slate-500">-</span>';

                    const tr = document.createElement('tr');
                    tr.className = 'border-b border-slate-800 hover:bg-slate-800/50 transition-colors';
                    tr.innerHTML = `
                        <td class="p-4 text-slate-400">${data}</td>
                        <td class="p-4 text-white font-medium">${p.cliente_nome || 'Cliente'}</td>
                        <td class="p-4">${p.tipo || 'Instagram'}</td>
                        <td class="p-4">${p.titulo}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold bg-blue-500/20 text-blue-400">${(p.status || 'planejado').toUpperCase()}</span></td>
                        <td class="p-4 max-w-xs">${feedback}</td>
                        <td class="p-4 text-right">
                            <button onclick="excluirPost(${p.id})" class="text-red-500 hover:text-red-400 text-xs font-bold">Excluir</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('tabelaPosts').innerHTML = '<tr><td colspan="7" class="p-4 text-center text-red-500">Erro ao carregar posts. Verifique a tabela no banco.</td></tr>';
            }
        }

        async function carregarClientesSelect() {
            try {
                const res = await fetch('/api/clientes', { headers: { 'Authorization': `Bearer ${token}` } });
                const clientes = await res.json();
                const select = document.getElementById('post_cliente');
                select.innerHTML = '<option value="">Selecione o cliente...</option>';
                clientes.forEach(c => {
                    select.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
                });
            } catch (e) { console.error('Erro ao carregar clientes:', e); }
        }

        document.getElementById('formPost').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                cliente_id: document.getElementById('post_cliente').value,
                titulo: document.getElementById('post_titulo').value,
                tipo: document.getElementById('post_plataforma').value, // tipo = plataforma
                data_publicacao: document.getElementById('post_data').value || null,
                status: 'planejado'
            };

            try {
                const res = await fetch('/api/acoes-sociais', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(dados)
                });

                if (res.ok) {
                    alert('Post agendado com sucesso!');
                    fecharModalPost();
                    document.getElementById('formPost').reset();
                    carregarPosts();
                } else {
                    alert('Erro ao agendar post.');
                }
            } catch (error) {
                alert('Erro de conexão.');
            }
        });

        async function excluirPost(id) {
            if (!confirm('Excluir este post?')) return;
            try {
                await fetch(`/api/acoes-sociais/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                carregarPosts();
            } catch (error) { alert('Erro ao excluir.'); }
        }

        function abrirModalPost() {
            document.getElementById('modalPost').classList.remove('hidden');
            document.getElementById('modalPost').classList.add('flex');
        }
        function fecharModalPost() {
            document.getElementById('modalPost').classList.add('hidden');
            document.getElementById('modalPost').classList.remove('flex');
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarPosts();
            carregarClientesSelect();
        });
    </script>
</body>
</html>
