<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Painel Administrativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border: 1px solid #334155;
      border-radius: 1rem;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }
    .login-card h1 { color: #f8faff; margin-bottom: 1.5rem; }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      color: #f8fafc;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
    }
    .input-field::placeholder { color: #64748b; }
    .btn-entrar {
      width: 100%;
      padding: 0.75rem;
      background: #f97316;
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-entrar:hover { background: #ea580c; }
    .btn-entrar:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="flex items-center justify-center mb-4">
      <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center mr-3">
        <span class="text-white font-bold text-lg">R</span>
      </div>
      <h1 class="text-2xl font-bold text-white">Reverse Marketing</h1>
    </div>
    <h1>Acesso Administrativo</h1>
    <p class="text-slate-400 text-sm mb-6">Digite suas credenciais abaixo.</p>

    <form id="loginForm">
      <div class="mb-4">
        <input type="email" id="email" name="email" class="input-field" placeholder="E-mail" required autocomplete="email">
      </div>
      <div class="mb-4">
        <input type="password" id="senha" name="senha" class="input-field" placeholder="Senha" required autocomplete="current-password">
      </div>
      <div id="feedback"></div>
      <button type="submit" class="btn-entrar">Entrar</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const feedback = document.getElementById('feedback');
        feedback.textContent = '';
        feedback.className = 'hidden';

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            const data = await response.json();
            if (response.ok) {
                localStorage.setItem('token', data.token);
                window.location.href = '/admin.html';
            } else {
                feedback.textContent = data.error || 'Credenciais inválidas.';
                feedback.className = 'block text-red-500 text-sm font-bold mt-2';
            }
        } catch (error) {
            feedback.textContent = 'Erro ao conectar com o servidor.';
            feedback.className = 'block text-red-500 text-sm font-bold mt-2';
        }
    });
  </script>
</body>
</html>
