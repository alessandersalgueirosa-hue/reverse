<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Reverse Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-orange-500 rounded-full w-8 h-8 flex items-center justify-center font-bold text-white">R</div>
            <h1 class="text-xl font-bold">Gerenciar Usuários</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="/admin.html" class="text-sm text-slate-400 hover:text-white transition-colors">Dashboard</a>
            <a href="/clientes.html" class="text-sm text-slate-400 hover:text-white transition-colors">Clientes</a>
            <a href="/campanhas.html" class="text-sm text-slate-400 hover:text-white transition-colors">Campanhas</a>
            <a href="/calculadora-trafego.html" class="text-sm text-slate-400 hover:text-white transition-colors">Calculadora de Tráfego</a>
            <button id="btnSair" class="text-sm text-slate-400 hover:text-white transition-colors">Sair</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-8">
        
        <!-- Formulário de Novo Usuário -->
        <div class="bg-slate-900 p-6 rounded-lg border border-slate-800 shadow-lg mb-8">
            <h2 class="text-2xl font-extrabold mb-4">Novo Usuário</h2>
            <form id="formUsuario" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm text-slate-400 mb-1">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Ex: João Silva" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="email" required placeholder="joao@reverse.com" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Senha</label>
                    <input type="password" id="senha" required placeholder="Mínimo 6 caracteres" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Perfil</label>
                    <select id="role" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500">
                        <option value="vendedor">Vendedor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-lg transition-colors">Criar Usuário</button>
                </div>
            </form>
            <div id="feedbackUsuario" class="hidden mt-4 p-3 rounded-lg text-center font-bold"></div>
        </div>

        <!-- Lista de Usuários -->
        <div class="mb-4">
            <h2 class="text-2xl font-extrabold mb-1">Usuários Cadastrados</h2>
            <p class="text-slate-400">Gerencie os membros da equipe.</p>
        </div>

        <div class="bg-slate-900 rounded-lg shadow-lg overflow-x-auto border border-slate-800">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-slate-300 text-sm uppercase tracking-wider">
                        <th class="p-4">ID</th>
                        <th class="p-4">Nome</th>
                        <th class="p-4">E-mail</th>
                        <th class="p-4">Perfil</th>
                        <th class="p-4">Status</th>
                        <th class="p-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios" class="divide-y divide-slate-800">
                    <!-- Linhas inseridas via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal de Edição de Usuário -->
    <div id="modalEdicaoUsuario" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 rounded-lg shadow-2xl border border-slate-800 w-full max-w-lg flex flex-col">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-xl font-bold">Editar Usuário</h3>
                <button id="fecharModalEdicaoUsuario" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <div class="p-6">
                <form id="formEdicaoUsuario">
                    <input type="hidden" id="editUsuarioId">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">Nome</label>
                        <input type="text" id="editNomeUsuario" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">E-mail</label>
                        <input type="email" id="editEmailUsuario" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">Nova Senha (deixe em branco para manter)</label>
                        <input type="password" id="editSenhaUsuario" placeholder="Nova senha" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-orange-500">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">Perfil</label>
                        <select id="editRoleUsuario" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500">
                            <option value="vendedor">Vendedor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">Status</label>
                        <select id="editAtivoUsuario" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500">
                            <option value="true">Ativo</option>
                            <option value="false">Inativo</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition-colors">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login.html';
        }

        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role') || 'vendedor';
        
        // Se não for admin, redireciona para o dashboard
        if (role !== 'admin') {
            alert('Acesso negado. Apenas administradores podem acessar esta página.');
            window.location.href = '/admin.html';
        }

        let todosOsUsuarios = [];

        // --- CARREGAR USUÁRIOS ---
        async function carregarUsuarios() {
            try {
                const response = await fetch('/api/usuarios', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Falha ao buscar usuários');
                todosOsUsuarios = await response.json();
                renderizarTabela(todosOsUsuarios);
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao carregar usuários.');
            }
        }

        function renderizarTabela(usuarios) {
            const tbody = document.getElementById('tabelaUsuarios');
            tbody.innerHTML = '';

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Nenhum usuário cadastrado.</td></tr>`;
                return;
            }

            usuarios.forEach(u => {
                const statusColor = u.ativo ? 'text-green-400 bg-green-400/10' : 'text-red-400 bg-red-400/10';
                const statusText = u.ativo ? 'Ativo' : 'Inativo';
                const roleColor = u.role === 'admin' ? 'text-orange-400 bg-orange-400/10' : 'text-blue-400 bg-blue-400/10';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/50 transition-colors';
                tr.innerHTML = `
                    <td class="p-4 text-slate-400">${u.id}</td>
                    <td class="p-4 font-medium">${u.nome || '-'}</td>
                    <td class="p-4 text-blue-400">${u.email}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold ${roleColor}">${u.role}</span></td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${statusText}</span></td>
                    <td class="p-4 flex gap-2">
                        <button onclick="abrirEdicao(${u.id})" class="bg-cyan-600 hover:bg-cyan-700 text-white px-3 py-1 rounded text-sm transition-colors">Editar</button>
                        <button onclick="excluirUsuario(${u.id})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition-colors">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- CRIAR USUÁRIO ---
        document.getElementById('formUsuario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const feedback = document.getElementById('feedbackUsuario');
            feedback.className = 'hidden';

            const dados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
                role: document.getElementById('role').value
            };

            try {
                const response = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(dados)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Falha ao criar usuário');

                feedback.textContent = 'Usuário criado com sucesso!';
                feedback.className = 'mt-4 p-3 rounded-lg text-center font-bold bg-green-600 text-white';
                document.getElementById('formUsuario').reset();
                carregarUsuarios();
            } catch (error) {
                console.error('Erro:', error);
                feedback.textContent = error.message;
                feedback.className = 'mt-4 p-3 rounded-lg text-center font-bold bg-red-600 text-white';
            }
        });

        // --- EDITAR USUÁRIO ---
        function abrirEdicao(id) {
            const usuario = todosOsUsuarios.find(u => u.id === id);
            if (!usuario) return;

            document.getElementById('editUsuarioId').value = usuario.id;
            document.getElementById('editNomeUsuario').value = usuario.nome || '';
            document.getElementById('editEmailUsuario').value = usuario.email;
            document.getElementById('editSenhaUsuario').value = '';
            document.getElementById('editRoleUsuario').value = usuario.role;
            document.getElementById('editAtivoUsuario').value = usuario.ativo ? 'true' : 'false';

            document.getElementById('modalEdicaoUsuario').classList.remove('hidden');
        }

        document.getElementById('fecharModalEdicaoUsuario').addEventListener('click', () => {
            document.getElementById('modalEdicaoUsuario').classList.add('hidden');
        });

        document.getElementById('modalEdicaoUsuario').addEventListener('click', (e) => {
            if (e.target.id === 'modalEdicaoUsuario') {
                document.getElementById('modalEdicaoUsuario').classList.add('hidden');
            }
        });

        document.getElementById('formEdicaoUsuario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editUsuarioId').value;
            const dados = {
                nome: document.getElementById('editNomeUsuario').value,
                email: document.getElementById('editEmailUsuario').value,
                senha: document.getElementById('editSenhaUsuario').value || undefined,
                role: document.getElementById('editRoleUsuario').value,
                ativo: document.getElementById('editAtivoUsuario').value === 'true'
            };

            try {
                const response = await fetch(`/api/usuarios/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(dados)
                });
                if (!response.ok) throw new Error('Falha ao atualizar usuário');
                alert('Usuário atualizado!');
                document.getElementById('modalEdicaoUsuario').classList.add('hidden');
                carregarUsuarios();
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao atualizar usuário.');
            }
        });

        // --- EXCLUIR USUÁRIO ---
        async function excluirUsuario(id) {
            if (!confirm('Tem certeza que deseja excluir este usuário?')) return;
            try {
                const response = await fetch(`/api/usuarios/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Falha ao excluir');
                alert('Usuário excluído!');
                carregarUsuarios();
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro: ' + error.message);
            }
        }

        // --- LOGOUT ---
        document.getElementById('btnSair').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            localStorage.removeItem('nome');
            window.location.href = '/login.html';
        });

        // --- INICIALIZAÇÃO ---
        carregarUsuarios();
    </script>
</body>
</html>
