<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Reverse Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        .pyside-button { transition: all 0.2s ease; border-radius: 0.375rem; font-weight: 500; }
        .pyside-button:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(249, 115, 22, 0.2); }
    </style>

    <style id="mobile-menu-style">
        @media (max-width: 768px) {
            #menu-admin nav, #menu-cliente nav {
                display: none !important;
                flex-direction: column;
                width: 100%;
                background-color: #0f172a;
                padding: 1rem;
                border-radius: 0.5rem;
                margin-top: 1rem;
                border: 1px solid #1e293b;
            }
            #menu-admin nav.active, #menu-cliente nav.active {
                display: flex !important;
            }
            .mobile-menu-btn {
                display: block !important;
                background: none;
                border: none;
                color: white;
                cursor: pointer;
                padding: 0.5rem;
            }
            /* No celular, os submenus ficam sempre abertos para facilitar o toque */
            .relative.group > div {
                position: static !important;
                opacity: 1 !important;
                visibility: visible !important;
                display: flex !important;
                flex-direction: column;
                box-shadow: none !important;
                border: none !important;
                background: transparent !important;
                padding-left: 1rem;
            }
            .relative.group button {
                width: 100%;
                justify-content: space-between;
            }
        }
        @media (min-width: 769px) {
            .mobile-menu-btn { display: none !important; }
        }
    </style>

</head>
<body class="bg-slate-950 text-white font-sans antialiased">

    <!-- MENU ADMIN -->
    <header id="menu-admin" class="bg-slate-900 border-b border-slate-800 p-4 relative z-50">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="/logo.png" alt="Reverse Marketing" class="h-8 w-auto object-contain">
                <h1 class="text-xl font-bold">Reverse Marketing</h1>
            </div>
            <nav class="flex flex-wrap items-center gap-1 text-sm text-slate-300">
                <a href="/admin.html" class="px-3 py-2 rounded hover:bg-slate-800 hover:text-white transition-colors">Dashboard</a>
                <div class="relative group">
                    <button class="px-3 py-2 rounded hover:bg-slate-800 hover:text-white transition-colors flex items-center gap-1">Gestão <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button>
                    <div class="absolute left-0 top-full mt-1 w-48 bg-slate-800 border border-slate-700 rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 flex flex-col overflow-hidden">
                        <a href="/financeiro.html" class="px-4 py-2 hover:bg-slate-700 text-white">Financeiro</a>
                        <a href="/propostas.html" class="px-4 py-2 hover:bg-slate-700 text-white">Propostas</a>
                        <a href="/produtos.html" class="px-4 py-2 hover:bg-slate-700 text-white">Produtos</a>
                        <a href="/relatorios.html" class="px-4 py-2 hover:bg-slate-700 text-white font-bold text-orange-400">Relatórios</a>
                    </div>
                </div>
                <button class="btn-sair bg-slate-800 hover:bg-red-600 text-white font-bold py-1.5 px-3 rounded transition-colors ml-2">Sair</button>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-8">
        <div class="flex items-center gap-4 mb-8 bg-slate-900 p-6 rounded-lg border border-slate-800 shadow-lg">
            <div class="p-3 bg-orange-500/20 rounded-lg text-orange-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">Relatórios da Agência</h1>
                <p class="text-slate-400 text-sm">Gere um PDF com o balanço geral da agência por período.</p>
            </div>
        </div>

        <div class="bg-slate-900 p-8 rounded-lg border border-slate-800 shadow-lg flex flex-col items-center justify-center gap-6">
            <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Mês</label>
                    <select id="relatorioMes" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500">
                        <option value="01">Janeiro</option>
                        <option value="02">Fevereiro</option>
                        <option value="03">Março</option>
                        <option value="04">Abril</option>
                        <option value="05">Maio</option>
                        <option value="06">Junho</option>
                        <option value="07">Julho</option>
                        <option value="08">Agosto</option>
                        <option value="09">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Ano</label>
                    <input type="number" id="relatorioAno" value="2026" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500">
                </div>
            </div>

            <button onclick="gerarRelatorio()" class="pyside-button w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-lg rounded-lg shadow-lg flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Gerar Relatório PDF
            </button>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        // Preenche o mês atual automaticamente
        document.addEventListener('DOMContentLoaded', () => {
            const hoje = new Date();
            document.getElementById('relatorioMes').value = String(hoje.getMonth() + 1).padStart(2, '0');
            document.getElementById('relatorioAno').value = hoje.getFullYear();
        });

        async function gerarRelatorio() {
            const mes = document.getElementById('relatorioMes').value;
            const ano = document.getElementById('relatorioAno').value;
            
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Gerando PDF...';
            btn.disabled = true;

            try {
                const response = await fetch(`/api/relatorio/geral?mes=${mes}&ano=${ano}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Falha ao gerar relatório');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `relatorio-geral-${mes}-${ano}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

            } catch (error) {
                alert('Erro ao gerar o relatório.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        document.querySelectorAll('.btn-sair').forEach(btn => {
            btn.addEventListener('click', () => {
                localStorage.removeItem('token'); window.location.href = '/login.html';
            });
        });
    </script>

    <script id="mobile-menu-script">
        document.addEventListener('DOMContentLoaded', () => {
            const headers = document.querySelectorAll('header');
            headers.forEach(header => {
                const nav = header.querySelector('nav');
                if(!nav) return;

                const btn = document.createElement('button');
                btn.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>';
                btn.className = 'mobile-menu-btn p-2 rounded hover:bg-slate-800 text-slate-300 ml-auto';
                
                btn.onclick = () => {
                    nav.classList.toggle('active');
                };

                nav.parentNode.insertBefore(btn, nav);
            });
        });
    </script>

</body>
</html>
