<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Cliente - Reverse Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/ux.js"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased flex items-center justify-center min-h-screen">

    <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <img src="/logo.png" alt="Reverse Marketing" class="h-12 mx-auto mb-4 object-contain">
            <h1 class="text-2xl font-bold text-white">Área do Cliente</h1>
            <p class="text-slate-400 text-sm mt-1">Acesse o seu portal exclusivo.</p>
        </div>

        <form id="formLoginCliente" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">E-mail</label>
                <input type="email" id="email" required class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 transition-colors" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Senha</label>
                <input type="password" id="senha" required class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 transition-colors" placeholder="••••••••">
            </div>
            
            <div id="erroLogin" class="hidden text-red-400 text-sm text-center bg-red-500/10 p-2 rounded border border-red-500/30"></div>

            <button type="submit" id="btnEntrar" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-lg transition-colors flex justify-center items-center">
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-800 pt-4">
            <a href="/login.html" class="text-sm text-slate-500 hover:text-slate-300 transition-colors">Voltar para o Login Administrativo</a>
        </div>
    </div>

    <script>
        document.getElementById('formLoginCliente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnEntrar');
            const erroDiv = document.getElementById('erroLogin');
            
            btn.disabled = true;
            btn.innerHTML = 'Entrando...';
            erroDiv.classList.add('hidden');

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const response = await fetch('/api/login-cliente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    // Salva o token e as permissões no navegador
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('permissoes', JSON.stringify(data.permissoes));
                    
                    // Redireciona para o portal
                    window.location.href = '/portal_cliente.html';
                } else {
                    erroDiv.innerText = data.error || 'Credenciais inválidas.';
                    erroDiv.classList.remove('hidden');
                }
            } catch (error) {
                erroDiv.innerText = 'Erro de conexão com o servidor.';
                erroDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Entrar';
            }
        });
    </script>
</body>
</html>
